name: Merge Claude branch to main

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to merge (e.g. claude/enhance-blog-interactivity-8CTgl)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge PR for branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ inputs.branch }}"
          PR_NUM=$(gh pr list --head "$BRANCH" --json number -q '.[0].number')
          if [ -z "$PR_NUM" ]; then
            echo "No open PR found for $BRANCH"
            exit 1
          fi
          gh pr merge "$PR_NUM" --merge --delete-branch
          echo "Merged PR #$PR_NUM to main"
